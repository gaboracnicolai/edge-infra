name: Test

# Runs the unit + integration test suites. The existing images.yaml only
# *builds* the binaries, so before this workflow nothing actually executed
# the auth-service integration tests or the control-plane Go tests on a PR.
on:
  push:
    paths:
      - 'auth-service/**'
      - 'cmd/**'
      - 'internal/**'
      - 'go.mod'
      - 'go.sum'
      - '.github/workflows/test.yaml'
  pull_request:
    branches: [main]
    paths:
      - 'auth-service/**'
      - 'cmd/**'
      - 'internal/**'
      - 'go.mod'
      - 'go.sum'
      - '.github/workflows/test.yaml'

jobs:
  auth-service:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Cache cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            auth-service/target
          key: cargo-test-${{ hashFiles('auth-service/Cargo.lock') }}
          restore-keys: |
            cargo-test-
      - name: cargo test
        working-directory: auth-service
        run: cargo test --locked

  control-plane:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: '1.24'
          cache: true
      - name: go test
        run: go test ./... -count=1
      # Two tests match -run TestXDS and they prove DIFFERENT things:
      #   TestXDSMutualTLSHandshake   — Go client vs Go server, pure in-memory certs.
      #   TestXDSRealEnvoyTLSVersion  — a REAL envoyproxy/envoy container against the
      #                                 real buildTLSCreds server. This is the only
      #                                 thing in the repo that proves Envoy and the
      #                                 control plane can actually complete a
      #                                 handshake, and it is F10's regression test.
      #
      # ⚠ THE REAL-ENVOY ONE SKIPS ITSELF WHEN DOCKER IS ABSENT, and `go test` prints
      # `ok` and EXITS 0 on a SKIP. So the Go-only sibling's PASS carried this step
      # either way: with docker unavailable the command still exited 0 while
      # `--- SKIP: TestXDSRealEnvoyTLSVersion` sat in the output. "Wired into CI" and
      # "actually executed" are different claims, and the gap between them is exactly
      # the shape F10 survived in for a whole work arc. Assert the stronger claim.
      #
      # ⚠ `set -o pipefail` is load-bearing. Without it `go test | tee` reports TEE's
      # status, so a genuine FAILURE exits 0 and only the SKIP check would speak. The
      # default GitHub shell is `bash -e {0}` — no pipefail — so it must be explicit.
      - name: xDS mTLS handshake + real-Envoy TLS pairing (integration-tagged)
        run: |
          set -euo pipefail
          go test -tags integration -v ./cmd/server/ -run TestXDS -count=1 2>&1 | tee /tmp/xds.log
          if grep -q -- '--- SKIP' /tmp/xds.log; then
            echo "::error::a TestXDS case SKIPPED — the real-Envoy handshake proof did not run"
            grep -- '--- SKIP' /tmp/xds.log
            exit 1
          fi
