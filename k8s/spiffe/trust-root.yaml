# Agent certificates (SVIDs) — the trust root csi-driver-spiffe signs with.
#
# A CA of its own, separate from edge-internal-ca: an agent's certificate must
# never be valid as an Edge component's, and an Edge component's must never be
# accepted as an agent's. csi-driver-spiffe (see csi-driver-spiffe-values.yaml)
# asks the edge-spiffe ClusterIssuer for a short-lived certificate for every pod
# that mounts its volume, with the pod's SPIFFE ID as the URI SAN:
#
#   spiffe://<trust domain>/ns/<namespace>/sa/<service account>
#
# The CA certificate (ca.crt of the edge-spiffe-ca Secret) is the trust bundle.
# Load it into edge-secrets as a validation_context and name it as a route's
# client_ca_secret_name with auth_policy=mtls: Envoy receives it over SDS and
# refuses, at the TLS handshake, every caller without a certificate it signed.
# docs/agent-certificates.md has the commands.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: edge-spiffe-selfsigned
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  selfSigned: {}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: edge-spiffe-ca
  namespace: cert-manager   # cert-manager's cluster-resource namespace: where a ClusterIssuer's ca.secretName is read
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  isCA: true
  commonName: talyvor-edge-agent-ca
  secretName: edge-spiffe-ca
  duration: 87600h    # 10y root
  renewBefore: 720h
  privateKey:
    algorithm: ECDSA
    size: 256
  issuerRef:
    name: edge-spiffe-selfsigned
    kind: ClusterIssuer
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: edge-spiffe
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  ca:
    secretName: edge-spiffe-ca
