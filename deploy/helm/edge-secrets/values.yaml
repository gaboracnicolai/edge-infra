replicaCount: 2

image:
  repository: ghcr.io/gaboracnicolai/edge-secrets
  tag: "ad3eed7c31f72c3f7892cf9ce1270bacd7a9f13e"  # pin to the SHA you pushed
  pullPolicy: IfNotPresent

service:
  type: ClusterIP   # never publicly routable — operator access only
  port: 8082

config:
  # Secret holding SECRETS_DATABASE_URL (the shared DB) and, optionally,
  # SECRETS_ADMIN_API_KEY (the fallback auth key).
  existingSecret: edge-secrets-config

tls:
  # Serving cert (TLS is MANDATORY — private key material ships over the wire).
  existingSecret: edge-secrets-tls
  mountPath: /etc/edge-secrets-tls

adminCA:
  # Operator client CA — the SEPARATE edge-admin-ca, NEVER the data-plane
  # edge-internal-ca. Client certs are verified against ONLY this CA, so a proxy
  # identity can never write key material. Provisioned out-of-band (PKI bootstrap).
  existingSecret: edge-admin-ca
  mountPath: /etc/edge-secrets-admin-ca
  key: ca.crt

# Pull secret(s) for private images, wired onto the ServiceAccount so pods (and
# hook Jobs) can pull without a manual `kubectl patch sa`. e.g. [{name: ghcr}].
imagePullSecrets: []

serviceAccount:
  create: true
  name: ""

resources:
  requests:
    cpu: 50m
    memory: 32Mi
  limits:
    cpu: 250m
    memory: 128Mi

podAnnotations: {}

nameOverride: ""
fullnameOverride: ""

# NetworkPolicy (B27.33): when enabled, no ingress reaches the custodian except
# what extraIngress names (kubectl port-forward is not network traffic and
# still works). Enforced by Calico (or any CNI that enforces NetworkPolicy).
networkPolicy:
  enabled: false
  extraIngress: []

global:
  # Pull every image this chart runs from this registry instead of the one each
  # image names: a mirror, or the local registry of an air-gapped install (e.g.
  # registry.internal:5000). The path is kept, so mirror the images under it:
  # ghcr.io/gaboracnicolai/edge-osb -> <registry>/gaboracnicolai/edge-osb,
  # envoyproxy/envoy -> <registry>/envoyproxy/envoy,
  # redis -> <registry>/library/redis.  "" = each image's own registry.
  imageRegistry: ""
