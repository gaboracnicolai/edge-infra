# `helm test <release>`: the custodian is up on its Service AND refuses a client
# with no certificate — its listener is mutual TLS, operator certs only. A refused
# or timed-out connection fails the test; only the TLS refusal passes it.
apiVersion: v1
kind: Pod
metadata:
  name: {{ include "edge-secrets.fullname" . }}-test
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "edge-secrets.testLabels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
    # Kept after a run, so `helm test --logs` can read it; the next run replaces it.
    "helm.sh/hook-delete-policy": before-hook-creation
spec:
  restartPolicy: Never
  automountServiceAccountToken: false
  {{- with .Values.imagePullSecrets }}
  imagePullSecrets:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  securityContext:
    runAsNonRoot: true
    runAsUser: 100   # the curl image's curl_user:curl_group
    runAsGroup: 101
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: test
      image: {{ include "edge-secrets.image" (dict "image" .Values.tests.image "global" .Values.global) | quote }}
      imagePullPolicy: {{ .Values.tests.image.pullPolicy }}
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop: ["ALL"]
      command: ["sh", "-c"]
      args:
        - |
          set -eu
          url="https://{{ include "edge-secrets.fullname" . }}:{{ .Values.service.port }}/"
          out=""; i=0
          while [ "$i" -lt 10 ]; do
            out="$(curl -sSk --max-time 10 "$url" 2>&1 || true)"
            case "$out" in *"certificate required"*) break ;; esac
            i=$((i + 1)); sleep 3
          done
          echo "GET $url with no client certificate -> $out"
          case "$out" in
            *"certificate required"*) echo "PASS: the custodian answers on its Service and refuses a client without a certificate" ;;
            *) echo "FAIL: expected the TLS alert 'certificate required'"; exit 1 ;;
          esac
