{{- if .Values.grafana.enabled }}
{{- $labels := include "edge-observability.labels" (dict "ctx" $ "component" "grafana") }}
{{- $ns := .Release.Namespace }}
{{- $ds := .Values.grafana.datasources }}
{{- $promUrl := $ds.prometheusUrl | default (and .Values.prometheus.enabled (printf "http://prometheus.%s.svc.cluster.local:9090" $ns)) }}
{{- $lokiUrl := $ds.lokiUrl | default (and .Values.loki.enabled (printf "http://loki.%s.svc.cluster.local:3100" $ns)) }}
{{- $tempoUrl := $ds.tempoUrl | default (and .Values.tempo.enabled (printf "http://tempo.%s.svc.cluster.local:3200" $ns)) }}
{{- $adminSecret := .Values.grafana.admin.existingSecret | default (printf "%s-grafana" .Release.Name) }}
{{- if not .Values.grafana.admin.existingSecret }}
{{- $existing := lookup "v1" "Secret" $ns $adminSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $adminSecret }}
  namespace: {{ $ns }}
  labels:
    {{- $labels | nindent 4 }}
  annotations:
    # Kept on uninstall, so a reinstall keeps the password.
    helm.sh/resource-policy: keep
type: Opaque
data:
  admin-user: {{ "admin" | b64enc }}
  {{- if and $existing (index $existing.data "admin-password") }}
  admin-password: {{ index $existing.data "admin-password" }}
  {{- else }}
  admin-password: {{ randAlphaNum 32 | b64enc }}
  {{- end }}
---
{{- end }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-provisioning
  namespace: {{ $ns }}
  labels:
    {{- $labels | nindent 4 }}
data:
  datasources.yaml: |
    apiVersion: 1
    datasources:
      {{- if $promUrl }}
      - name: Prometheus
        type: prometheus
        uid: prometheus
        url: {{ $promUrl }}
        access: proxy
        isDefault: true
        jsonData:
          timeInterval: {{ .Values.prometheus.scrapeInterval }}
          {{- if $tempoUrl }}
          exemplarTraceIdDestinations:
            - name: traceID
              datasourceUid: tempo
          {{- end }}
      {{- end }}
      {{- if $lokiUrl }}
      - name: Loki
        type: loki
        uid: loki
        url: {{ $lokiUrl }}
        access: proxy
        {{- if $tempoUrl }}
        jsonData:
          derivedFields:
            - datasourceUid: tempo
              matcherRegex: '"trace_id":"(\w+)"'
              name: TraceID
              url: "$${__value.raw}"
        {{- end }}
      {{- end }}
      {{- if $tempoUrl }}
      - name: Tempo
        type: tempo
        uid: tempo
        url: {{ $tempoUrl }}
        access: proxy
        jsonData:
          {{- if $lokiUrl }}
          tracesToLogsV2:
            datasourceUid: loki
            filterByTraceID: true
          {{- end }}
          {{- if $promUrl }}
          serviceMap:
            datasourceUid: prometheus
          {{- end }}
      {{- end }}
  dashboards.yaml: |
    apiVersion: 1
    providers:
      - name: edge
        folder: Talyvor Edge
        type: file
        disableDeletion: true
        allowUiUpdates: false
        options:
          path: /etc/grafana/dashboards
---
# The dashboards in this chart's dashboards/ directory.
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboards
  namespace: {{ $ns }}
  labels:
    {{- $labels | nindent 4 }}
data:
  {{- (.Files.Glob "dashboards/*.json").AsConfig | nindent 2 }}
---
{{- with (include "edge-observability.pvc" (dict "ctx" $ "component" "grafana" "persistence" .Values.grafana.persistence)) }}
{{ . }}
---
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: {{ $ns }}
  labels:
    {{- $labels | nindent 4 }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "edge-observability.selectorLabels" (dict "ctx" $ "component" "grafana") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- $labels | nindent 8 }}
      annotations:
        checksum/provisioning: {{ printf "%s%s%s" $promUrl $lokiUrl $tempoUrl | sha256sum }}
        checksum/dashboards: {{ (.Files.Glob "dashboards/*.json").AsConfig | sha256sum }}
    spec:
      automountServiceAccountToken: false
      securityContext:
        {{- include "edge-observability.podSecurityContext" 472 | nindent 8 }}
      containers:
        - name: grafana
          image: {{ include "edge-observability.image" (dict "image" .Values.grafana.image "global" .Values.global) | quote }}
          env:
            - name: GF_SECURITY_ADMIN_USER
              valueFrom:
                secretKeyRef:
                  name: {{ $adminSecret }}
                  key: admin-user
            - name: GF_SECURITY_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ $adminSecret }}
                  key: admin-password
            # Logs to stdout only: the root filesystem is read-only.
            - name: GF_LOG_MODE
              value: console
            # Opening Grafana lands on the gateway's request traffic.
            - name: GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH
              value: /etc/grafana/dashboards/request-traffic.json
            # Nothing leaves the cluster: no usage report, update check, news
            # feed or plugin download at start.
            - name: GF_ANALYTICS_REPORTING_ENABLED
              value: "false"
            - name: GF_ANALYTICS_CHECK_FOR_UPDATES
              value: "false"
            - name: GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES
              value: "false"
            - name: GF_NEWS_NEWS_FEED_ENABLED
              value: "false"
            - name: GF_PLUGINS_PREINSTALL_DISABLED
              value: "true"
          ports:
            - name: http
              containerPort: 3000
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            periodSeconds: 5
            timeoutSeconds: 5
          securityContext:
            {{- include "edge-observability.containerSecurityContext" . | nindent 12 }}
          resources:
            {{- toYaml .Values.grafana.resources | nindent 12 }}
          volumeMounts:
            - name: provisioning
              mountPath: /etc/grafana/provisioning/datasources/datasources.yaml
              subPath: datasources.yaml
            - name: provisioning
              mountPath: /etc/grafana/provisioning/dashboards/dashboards.yaml
              subPath: dashboards.yaml
            - name: dashboards
              mountPath: /etc/grafana/dashboards
            - name: data
              mountPath: /var/lib/grafana
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: provisioning
          configMap:
            name: grafana-provisioning
        - name: dashboards
          configMap:
            name: grafana-dashboards
        - name: tmp
          emptyDir: {}
        {{- include "edge-observability.dataVolume" (dict "name" "grafana-data" "persistence" .Values.grafana.persistence) | nindent 8 }}
---
apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: {{ $ns }}
  labels:
    {{- $labels | nindent 4 }}
spec:
  type: {{ .Values.grafana.service.type }}
  selector:
    {{- include "edge-observability.selectorLabels" (dict "ctx" $ "component" "grafana") | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.grafana.service.port }}
      targetPort: http
{{- end }}
