{{- if .Values.loki.enabled }}
{{- $labels := include "edge-observability.labels" (dict "ctx" $ "component" "loki") }}
{{- $config := include "edge-observability.lokiConfig" . }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: loki-config
  namespace: {{ .Release.Namespace }}
  labels:
    {{- $labels | nindent 4 }}
data:
  loki.yaml: |
    {{- $config | nindent 4 }}
---
{{- with (include "edge-observability.pvc" (dict "ctx" $ "component" "loki" "persistence" .Values.loki.persistence)) }}
{{ . }}
---
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: loki
  namespace: {{ .Release.Namespace }}
  labels:
    {{- $labels | nindent 4 }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "edge-observability.selectorLabels" (dict "ctx" $ "component" "loki") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- $labels | nindent 8 }}
      annotations:
        checksum/config: {{ $config | sha256sum }}
    spec:
      automountServiceAccountToken: false
      securityContext:
        {{- include "edge-observability.podSecurityContext" 10001 | nindent 8 }}
      containers:
        - name: loki
          image: {{ include "edge-observability.image" (dict "image" .Values.loki.image "global" .Values.global) | quote }}
          args:
            - -config.file=/etc/loki/loki.yaml
          ports:
            - name: http
              containerPort: 3100
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            periodSeconds: 5
            timeoutSeconds: 5
          securityContext:
            {{- include "edge-observability.containerSecurityContext" . | nindent 12 }}
          resources:
            {{- toYaml .Values.loki.resources | nindent 12 }}
          volumeMounts:
            - name: config
              mountPath: /etc/loki
            - name: data
              mountPath: /loki
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: config
          configMap:
            name: loki-config
        - name: tmp
          emptyDir: {}
        {{- include "edge-observability.dataVolume" (dict "name" "loki-data" "persistence" .Values.loki.persistence) | nindent 8 }}
---
apiVersion: v1
kind: Service
metadata:
  name: loki
  namespace: {{ .Release.Namespace }}
  labels:
    {{- $labels | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "edge-observability.selectorLabels" (dict "ctx" $ "component" "loki") | nindent 4 }}
  ports:
    - name: http
      port: 3100
      targetPort: http
{{- end }}

{{- define "edge-observability.lokiConfig" -}}
# One process, chunks and index on the data volume.
auth_enabled: false
server:
  http_listen_port: 3100
  grpc_listen_port: 9096
common:
  instance_addr: 127.0.0.1
  path_prefix: /loki
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
schema_config:
  configs:
    - from: "2024-01-01"
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h
limits_config:
  retention_period: {{ .Values.loki.retention }}
  allow_structured_metadata: true
compactor:
  working_directory: /loki/compactor
  retention_enabled: true
  delete_request_store: filesystem
# Nothing leaves the cluster.
analytics:
  reporting_enabled: false
{{- end -}}
