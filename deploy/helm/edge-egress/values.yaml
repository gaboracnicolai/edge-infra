# edge-egress — the egress gateway agents send their outbound calls through
# (B28.222). Each Envoy here connects to the control plane as node
# "edge-egress/<pod name>" and receives only the egress snapshot: one proxy
# listener that reaches the hosts in the egress_destinations table and answers
# 403 for every other host. No gateway listener, route or key reaches it.
#
# Agents use it as their proxy:
#   http_proxy=http://edge-egress.<namespace>.svc:3128   # TLS originated and verified here
#   https_proxy=http://edge-egress.<namespace>.svc:3128  # CONNECT, the agent's TLS end to end
image:
  repository: envoyproxy/envoy
  tag: v1.39.2@sha256:460f8c329f24b2e1c7c5af64cb314a6f351ad1c262ba77b135ac46b35ebd5f85  # pinned digest
  pullPolicy: IfNotPresent

replicaCount: 2

proxy:
  # MUST equal the control plane's EGRESS_LISTENER_PORT (default 3128): the
  # listener is rendered by the control plane; this only names the port the pod
  # and Service expose.
  port: 3128

xds:
  controlPlaneHost: edge-control-plane.infra.svc.cluster.local
  controlPlanePort: 18000
  tls:
    # mTLS to the control-plane xDS server, which requires client certs
    # unconditionally — the same client certificate edge-proxy uses, so install
    # this chart in edge-proxy's namespace (the control plane's NetworkPolicy
    # admits xDS from that namespace).
    enabled: true
    existingSecret: envoy-xds-client-tls-secret
    mountPath: /etc/xds-client-tls

# Pull secret(s) for private images, wired onto the ServiceAccount.
imagePullSecrets: []

serviceAccount:
  create: true
  name: ""

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 1000m
    memory: 512Mi

podAnnotations:
  prometheus.io/scrape: "true"
  prometheus.io/port: "9903"
  prometheus.io/path: "/stats/prometheus"

nameOverride: ""
fullnameOverride: ""
