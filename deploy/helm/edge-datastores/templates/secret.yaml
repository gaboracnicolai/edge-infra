{{- if .Values.global.datastores.createSecret }}
{{- $name := .Values.global.datastores.secretName -}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name -}}
{{- $c := dict -}}

{{- if .Values.postgres.enabled }}
{{- $pg := .Values.postgres.auth -}}
{{- $pw := include "edge-datastores.credential" (list $ $existing "POSTGRES_PASSWORD" $pg.password) -}}
{{- $host := include "edge-datastores.host" (dict "root" $ "store" "postgres") -}}
{{- $base := printf "postgres://%s:%s@%s:5432" $pg.username (urlquery $pw) $host -}}
{{- $_ := set $c "POSTGRES_PASSWORD" $pw -}}
{{- $_ := set $c "POSTGRES_DSN" (printf "%s/%s?sslmode=disable" $base $pg.database) -}}
{{- if has "issuer" .Values.postgres.extraDatabases }}
{{- $_ := set $c "ISSUER_DATABASE_URL" (printf "%s/issuer?sslmode=disable" $base) -}}
{{- end }}
{{- else }}
{{- $_ := set $c "POSTGRES_DSN" (required "postgres.enabled=false: set external.postgres.dsn to your Postgres (the edge database)" .Values.external.postgres.dsn) -}}
{{- with .Values.external.postgres.issuerDsn }}
{{- $_ := set $c "ISSUER_DATABASE_URL" . -}}
{{- end }}
{{- end }}

{{- if .Values.redis.enabled }}
{{- $pw := include "edge-datastores.credential" (list $ $existing "REDIS_PASSWORD" .Values.redis.auth.password) -}}
{{- $_ := set $c "REDIS_ADDR" (printf "%s:6379" (include "edge-datastores.host" (dict "root" $ "store" "redis"))) -}}
{{- $_ := set $c "REDIS_PASSWORD" $pw -}}
{{- else if .Values.external.redis.addr }}
{{- $_ := set $c "REDIS_ADDR" .Values.external.redis.addr -}}
{{- with .Values.external.redis.password }}
{{- $_ := set $c "REDIS_PASSWORD" . -}}
{{- end }}
{{- end }}

{{- if .Values.nats.enabled }}
{{- $tok := include "edge-datastores.credential" (list $ $existing "NATS_TOKEN" .Values.nats.auth.token) -}}
{{- $_ := set $c "NATS_TOKEN" $tok -}}
{{- $_ := set $c "NATS_URL" (printf "nats://%s@%s:4222" (urlquery $tok) (include "edge-datastores.host" (dict "root" $ "store" "nats"))) -}}
{{- else if .Values.external.nats.url }}
{{- $_ := set $c "NATS_URL" .Values.external.nats.url -}}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "edge-datastores.labels" . | nindent 4 }}
  annotations:
    # Kept on uninstall: the bundled volumes outlive the release, and their
    # passwords were set on first start. A reinstall of the same release finds
    # this Secret and keeps using them.
    helm.sh/resource-policy: keep
type: Opaque
data:
  {{- range $k, $v := $c }}
  {{ $k }}: {{ $v | b64enc | quote }}
  {{- end }}
{{- end }}
