{{/*
This chart does NOT create the application Secret. The value
`config.existingSecret` (default: auth-service-secrets) must reference a
pre-existing Secret in the release namespace containing:

  JWKS_URL             — HTTPS endpoint serving the JSON Web Key Set
  JWT_AUDIENCE         — expected aud claim
  JWT_ISSUER           — expected iss claim
  JWT_ISSUERS          — optional: more identity providers, a JSON array of
                         {"issuer", "jwks_url", "audience"?}. Each token is
                         verified only with the keys of the issuer it names;
                         audience defaults to JWT_AUDIENCE. `aud` may be a
                         string (Okta) or an array (ServiceAccount tokens).
                         A provider the cluster cannot reach takes
                         "jwks_file" (a key of jwksFiles.existingSecret,
                         mounted at jwksFiles.mountPath) instead of jwks_url.
  TRANSIT_SIGNING_KEY  — PEM Ed25519 private key. Signs the short-lived,
                         single-use assertion injected as the x-gateway-auth
                         header. Backends verify it with the PUBLIC key served
                         at :9090/.well-known/transit-jwks.json — no backend
                         holds a secret. Optional: TRANSIT_TTL_S (default 30,
                         max 60) and TRANSIT_ISSUER (default edge-gateway).

Create it once before installing the chart, e.g.:

  kubectl -n infra create secret generic auth-service-secrets \
    --from-literal=JWKS_URL='https://auth.example.com/.well-known/jwks.json' \
    --from-literal=JWT_AUDIENCE='edge.example.com' \
    --from-literal=JWT_ISSUER='https://auth.example.com' \
    --from-literal=JWT_ISSUERS='[{"issuer":"https://dev-1.okta.com/oauth2/default","jwks_url":"https://dev-1.okta.com/oauth2/default/v1/keys","audience":"api://default"}]' \
    --from-file=TRANSIT_SIGNING_KEY=<(openssl genpkey -algorithm ed25519)

The Deployment pulls these via env.valueFrom.secretKeyRef.
*/}}
