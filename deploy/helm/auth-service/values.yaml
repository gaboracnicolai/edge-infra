replicaCount: 2

image:
  repository: ghcr.io/gaboracnicolai/auth-service
  tag: "447ceb18980fc02fdc7e28db16354c62e3018850"  # pin to the SHA you pushed
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  grpcPort: 50051
  metricsPort: 9090

config:
  existingSecret: auth-service-secrets

tls:
  existingSecret: auth-service-tls-secret  # created by k8s/certs/auth-service-cert.yaml
  mountPath: /etc/auth-tls

# Pull secret(s) for private images, wired onto the ServiceAccount so pods (and
# hook Jobs) can pull without a manual `kubectl patch sa`. e.g. [{name: ghcr}].
imagePullSecrets: []

serviceAccount:
  create: true
  name: ""

resources:
  requests:
    cpu: 200m
    memory: 64Mi
  limits:
    cpu: 1000m
    memory: 256Mi

podAnnotations:
  prometheus.io/scrape: "true"
  prometheus.io/port: "9090"

nameOverride: ""
fullnameOverride: ""

# NetworkPolicy (B27.33): default-deny ingress to this chart's pods, allowing
# only the flows in templates/networkpolicy.yaml. Enforced by Calico (or any
# CNI that enforces NetworkPolicy). OFF in the base values, like extAuthz:
# ArgoCD syncs base values, and switching it on without the right gatewayCIDRs
# cuts the gateway off. Switch it on in an env overlay, with that cluster's CIDRs.
networkPolicy:
  enabled: false
  # CIDR(s) of the nodes running edge-proxy. Envoy runs hostNetwork, so its
  # traffic carries the NODE IP, which no pod or namespace selector matches.
  # Required when enabled — the chart refuses to render without it.
  gatewayCIDRs: []
  # Pods in this namespace count as the gateway too.
  gatewayNamespace: edge
  # More ingress rules, appended as written, e.g. Prometheus on the metrics port:
  #   - from: [{namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: monitoring}}}]
  #     ports: [{port: metrics}]
  extraIngress: []

# Confidential compute (B27.34). OFF by default. ON, the pods run only on
# confidential nodes — the nodeSelector (and tolerations) below, plus
# runtimeClassName when your confidential runtime needs one (e.g. kata-qemu-snp or
# kata-qemu-tdx for Confidential Containers; empty for node pools that are
# confidential VMs end to end). And an `attest` init container must verify a
# fresh attestation report before auth-service starts: no report, or one that
# does not verify, and the pod never starts.
# The gate verifies "mock" reports only — the kind e2e's stand-in TEE (Phase 19).
# Real AMD SEV-SNP / Intel TDX reports need confidential VMs to produce and the
# vendor's certificate chain to verify; the gate refuses them as unverifiable.
confidential:
  enabled: false
  runtimeClassName: ""
  # Labels only your confidential nodes carry. Required when enabled.
  nodeSelector:
    talyvor.io/confidential: "true"
  tolerations: []
  attestation:
    image:
      repository: ghcr.io/gaboracnicolai/edge-attest
      tag: "latest"  # pin to the SHA you pushed
      pullPolicy: IfNotPresent
    # The attester's evidence endpoint; the gate adds ?runtime_data=<nonce>. The
    # default is the Confidential Containers attestation agent inside the guest.
    evidenceURL: http://127.0.0.1:8006/aa/evidence
    # The attester's ed25519 public key, base64. Required when enabled.
    trustedKey: ""
    # Launch measurements (hex) allowed to start. Required when enabled.
    measurements: []
    # Oldest report accepted, and how long to wait for the attester to answer.
    maxAge: 5m
    timeout: 30s
