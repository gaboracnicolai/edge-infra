{{- if .Values.podDisruptionBudget.enabled }}
# A voluntary disruption (a node drain, a cluster upgrade) evicts these pods only
# as far as this budget allows. A node that dies is not voluntary: replicas, not
# this budget, cover that.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "edge-control-plane.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "edge-control-plane.labels" . | nindent 4 }}
spec:
  {{- with .Values.podDisruptionBudget.minAvailable }}
  minAvailable: {{ . }}
  {{- else }}
  maxUnavailable: {{ .Values.podDisruptionBudget.maxUnavailable }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "edge-control-plane.selectorLabels" . | nindent 6 }}
{{- end }}
