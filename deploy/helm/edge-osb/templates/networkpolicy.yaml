{{- if .Values.networkPolicy.enabled }}
# Default-deny ingress (B27.33): when networkPolicy.enabled, the pods below
# accept only the flows listed; everything else is dropped by Calico (or any
# CNI that enforces NetworkPolicy). Kubelet probes still pass — traffic from a
# pod's own node is never blocked.
{{- if not .Values.networkPolicy.gatewayCIDRs }}
{{- fail "networkPolicy.gatewayCIDRs is required when networkPolicy.enabled: the CIDR(s) of the nodes running edge-proxy (Envoy runs hostNetwork, so its traffic carries the node IP)" }}
{{- end }}
# The broker API from the gateway only.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "edge-osb.fullname" . }}-api
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "edge-osb.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "edge-osb.apiSelectorLabels" . | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    - from:
        {{- range .Values.networkPolicy.gatewayCIDRs }}
        - ipBlock: { cidr: {{ . | quote }} }
        {{- end }}
        {{- with .Values.networkPolicy.gatewayNamespace }}
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ . | quote }}
        {{- end }}
      ports:
        - { protocol: TCP, port: http }
    # This chart's own `helm test` pod (templates/tests/), to the one port it checks.
    - from:
        - podSelector:
            matchLabels:
              {{- include "edge-osb.testLabels" . | nindent 14 }}
      ports:
        - { protocol: TCP, port: http }
    {{- with .Values.networkPolicy.extraIngress }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
---
# The worker only consumes NATS: it accepts no connections at all.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "edge-osb.fullname" . }}-worker
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "edge-osb.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "edge-osb.workerSelectorLabels" . | nindent 6 }}
  policyTypes: [Ingress]
  # No ingress rules: nothing reaches these pods over the network.
{{- end }}
