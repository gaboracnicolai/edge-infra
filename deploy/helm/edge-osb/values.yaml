api:
  replicaCount: 2
  image:
    repository: ghcr.io/gaboracnicolai/edge-osb
    tag: "447ceb18980fc02fdc7e28db16354c62e3018850"  # pin to the SHA you pushed
    pullPolicy: IfNotPresent
  port: 8080
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi

worker:
  replicaCount: 2
  image:
    repository: ghcr.io/gaboracnicolai/edge-osb
    tag: "447ceb18980fc02fdc7e28db16354c62e3018850"  # pin to the SHA you pushed
    pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi

config:
  # All process config (DATABASE_URL, NATS_URL, …) is pulled from this secret
  # via envFrom.
  #
  # THE PROVISIONING API IS NOT GATED BY ANY VALUE IN THIS SECRET. It is gated
  # per tenant: callers send `Authorization: Bearer <key>`, the broker SHA-256s
  # it and looks it up in the `tenant_api_keys` table (keys are never stored in
  # the clear). The row's team is the caller's ONLY tenant — a request body can
  # never name another one. 401 with no bearer, 403 when unrecognized. There is
  # nothing to set here to turn that on: it is on, and OSB REFUSES TO START when
  # `tenant_api_keys` is empty (see startup_tenancy_check).
  #
  # ⚠ This block previously documented an `API_KEY` here as the provisioning
  # gate. No such setting has ever existed — Settings is `extra="ignore"`, so an
  # operator who set it got no error and no gate, only the belief they had
  # configured one. The per-tenant scheme above replaced that never-built
  # shared-key design. tests/test_chart_config_contract.py now fails if any key
  # documented in this block is not a field the process actually reads.
  #
  # Access-control settings that DO live in this secret (ISO 27001 A.9):
  #   - ADMIN_API_KEY  gates /metrics. Callers (incl. Prometheus) must send a
  #                    matching X-Admin-Key header. Enabling it requires the
  #                    scrape job to inject the header (see podAnnotations below).
  #                    ⚠ UNSET = OPEN: /metrics is unauthenticated by default,
  #                    and this chart supplies no value for it. Set it here if
  #                    the metrics surface must be closed.
  existingSecret: edge-osb-secrets

# Transport security (ISO 27001 A.13). When `tls` is set, the OSB mounts its
# cert-manager-issued secret and is told to use verify-full Postgres TLS and
# mutual NATS TLS. Leave unset for local/plaintext dev.
tls:
  existingSecret: osb-client-tls-secret  # created by k8s/certs/osb-client-cert.yaml
  mountPath: /etc/osb-tls
  dbSslMode: verify-full

# Pull secret(s) for private images, wired onto the ServiceAccount so pods (and
# hook Jobs) can pull without a manual `kubectl patch sa`. e.g. [{name: ghcr}].
imagePullSecrets: []

serviceAccount:
  create: true
  name: ""

# Annotation-based scraping cannot attach the X-Admin-Key header. If you set
# ADMIN_API_KEY in the config secret, switch to a Prometheus ServiceMonitor
# whose endpoint carries `headers: {X-Admin-Key: <key from secret>}`, otherwise
# the scrape will get 401. /healthz stays open for kubelet probes either way.
podAnnotations:
  prometheus.io/scrape: "true"
  prometheus.io/port: "8080"

nameOverride: ""
fullnameOverride: ""
