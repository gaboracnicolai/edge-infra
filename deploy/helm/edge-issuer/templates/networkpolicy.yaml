{{- if .Values.networkPolicy.enabled }}
# Default-deny ingress (B27.33): when networkPolicy.enabled, the pods below
# accept only the flows listed; everything else is dropped by Calico (or any
# CNI that enforces NetworkPolicy). Kubelet probes still pass — traffic from a
# pod's own node is never blocked.
{{- if not .Values.networkPolicy.gatewayCIDRs }}
{{- fail "networkPolicy.gatewayCIDRs is required when networkPolicy.enabled: the CIDR(s) of the nodes running edge-proxy (Envoy runs hostNetwork, so its traffic carries the node IP)" }}
{{- end }}
# /login, /sso and /scim/v2 from the gateway; the JWKS from the auth-service.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "edge-issuer.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "edge-issuer.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "edge-issuer.selectorLabels" . | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    - from:
        {{- range .Values.networkPolicy.gatewayCIDRs }}
        - ipBlock: { cidr: {{ . | quote }} }
        {{- end }}
        {{- with .Values.networkPolicy.gatewayNamespace }}
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ . | quote }}
        {{- end }}
      ports:
        - { protocol: TCP, port: https }
    - from:
        - podSelector:
            matchLabels:
              app: auth-service
          namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.networkPolicy.authServiceNamespace | default .Release.Namespace | quote }}
      ports:
        - { protocol: TCP, port: https }
    {{- with .Values.networkPolicy.extraIngress }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
{{- end }}
