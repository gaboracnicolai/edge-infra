replicaCount: 2

image:
  repository: ghcr.io/gaboracnicolai/edge-issuer
  tag: "latest"  # pin to the SHA you pushed
  pullPolicy: IfNotPresent

service:
  type: ClusterIP   # never publicly routable; reached only via the gateway
  port: 8081

config:
  # Secret holding ISSUER_URL, ISSUER_AUDIENCE, ISSUER_DATABASE_URL.
  existingSecret: issuer-secrets
  # kid of the signing key to mint with — must match a <kid>.pem in the
  # signing-keys Secret below. Required.
  activeKid: ""
  tokenTTL: 1h

# Sign-in through the customer's OIDC identity provider, and SCIM user
# provisioning from it. Both are switched on by keys in config.existingSecret:
#   ISSUER_SCIM_TOKEN (32+ chars)  -> /scim/v2/Users, for the IdP's SCIM client
#   ISSUER_OIDC_ISSUER, ISSUER_OIDC_CLIENT_ID, ISSUER_OIDC_CLIENT_SECRET,
#   ISSUER_OIDC_REDIRECT_URL (this issuer's https://.../sso/callback)
#                                  -> /sso/login, for users
# A user signs in only once SCIM (or an operator) has created them, and loses
# sign-in the moment SCIM deactivates or deletes them.
sso:
  # PEM CA the IdP's TLS certificate chains to, as mounted in the pod
  # (e.g. /etc/issuer-tls/ca.crt for an IdP on the internal CA); "" = system roots.
  caFile: ""

signingKeys:
  # Secret whose data keys are "<kid>.pem" PEM-encoded RSA private keys.
  # Publish current + next here to rotate without downtime.
  existingSecret: issuer-signing-keys
  mountPath: /etc/issuer-keys

tls:
  # Serving cert (TLS is required — the auth-service fetches JWKS over https).
  # Created by k8s/certs/issuer-cert.yaml.
  existingSecret: issuer-tls-secret
  mountPath: /etc/issuer-tls

# Pull secret(s) for private images, wired onto the ServiceAccount so pods (and
# hook Jobs) can pull without a manual `kubectl patch sa`. e.g. [{name: ghcr}].
imagePullSecrets: []

serviceAccount:
  create: true
  name: ""

resources:
  requests:
    cpu: 100m
    memory: 64Mi
  limits:
    cpu: 500m
    memory: 256Mi

podAnnotations: {}

nameOverride: ""
fullnameOverride: ""

# NetworkPolicy (B27.33): default-deny ingress to this chart's pods, allowing
# only the flows in templates/networkpolicy.yaml. Enforced by Calico (or any
# CNI that enforces NetworkPolicy). OFF in the base values, like extAuthz:
# ArgoCD syncs base values, and switching it on without the right gatewayCIDRs
# cuts the gateway off. Switch it on in an env overlay, with that cluster's CIDRs.
networkPolicy:
  enabled: false
  # CIDR(s) of the nodes running edge-proxy. Envoy runs hostNetwork, so its
  # traffic carries the NODE IP, which no pod or namespace selector matches.
  # Required when enabled — the chart refuses to render without it.
  gatewayCIDRs: []
  # Pods in this namespace count as the gateway too.
  gatewayNamespace: edge
  # Namespace of the auth-service, which fetches the JWKS; "" = this release's.
  authServiceNamespace: ""
  # More ingress rules, appended as written, e.g. Prometheus on the metrics port:
  #   - from: [{namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: monitoring}}}]
  #     ports: [{port: metrics}]
  extraIngress: []
