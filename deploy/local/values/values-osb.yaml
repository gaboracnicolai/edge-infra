# Local overlay for edge-osb. The chart reads api.image / worker.image (NOT a
# top-level image.*), and api.replicaCount / worker.replicaCount.
api:
  image:
    repository: edge-osb
    tag: local
  replicaCount: 1
worker:
  image:
    repository: edge-osb
    tag: local
  replicaCount: 1
# Disable the chart's TLS block for dev — the datastores are plaintext (Postgres
# sslmode=disable, NATS no TLS). `null` removes the chart default so NO
# DB_SSL_MODE/NATS_TLS_* env or osb-tls mount is rendered (the chart couples DB
# TLS and mutual NATS TLS into one `with .Values.tls` block, and config.py
# refuses plaintext NATS once NATS_TLS_CA is set). DB_SSL_MODE=disable is instead
# supplied via the edge-osb-secrets envFrom.
tls: null

# NetworkPolicy ON locally (B27.33), so every phase runs under the charts'
# default-deny. 172.16.0.0/12 holds the kind node network (the hostNetwork
# edge-proxy's source) and excludes the 192.168.0.0/16 pod CIDR; Phase 7 checks
# every node IP falls inside it.
networkPolicy:
  enabled: true
  gatewayCIDRs: ["172.16.0.0/12"]

# The OSB shared HTTPS listener moves off :443, which Phase 8's plaintext
# local-gw already holds — two listeners on one port collide. Phase 21 reads the
# port back from the worker's SHARED_HTTPS_PORT.
sharedHttpsPort: 10443
