# Local overlay for edge-issuer (the migrate Job reuses the same image).
image:
  repository: edge-issuer
  tag: local
config:
  # kid of the RSA signing key in the issuer-signing-keys secret (k1.pem, created
  # in Phase 5). Required by the chart.
  activeKid: k1
# Same pre-install-hook vs ServiceAccount ordering issue as edge-control-plane
# (the issuer's migrate Job is a pre-install hook). Use the `default` SA locally.
serviceAccount:
  create: false

# NetworkPolicy ON locally (B27.33), so every phase runs under the charts'
# default-deny. 172.16.0.0/12 holds the kind node network (the hostNetwork
# edge-proxy's source) and excludes the 192.168.0.0/16 pod CIDR; Phase 7 checks
# every node IP falls inside it.
networkPolicy:
  enabled: true
  gatewayCIDRs: ["172.16.0.0/12"]
  # The minter pod stands in for a user's browser and for the IdP's SCIM client
  # (in production both reach the issuer through the gateway).
  extraIngress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: tenant-secure
          podSelector:
            matchLabels:
              app: minter
      ports:
        - { protocol: TCP, port: https }

# Dex (Phase 18, the stand-in for a customer's IdP) serves a certificate from
# the same internal CA as the issuer's own.
sso:
  caFile: /etc/issuer-tls/ca.crt
