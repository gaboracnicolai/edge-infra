# ha profile: copies spread across nodes and zones; two or more workers.
replicaCount: 2
topologySpreadConstraints:
  # No node holds more than one copy more than another, so losing a node loses
  # at most one copy. Nodes with a taint these pods do not tolerate (a control
  # plane, a cordoned node) are left out of the count.
  - maxSkew: 1
    topologyKey: kubernetes.io/hostname
    whenUnsatisfiable: DoNotSchedule
    nodeTaintsPolicy: Honor
    labelSelector:
      matchLabels: { app: edge-ratelimit }
    matchLabelKeys: [pod-template-hash]
  # Across zones too, where the nodes carry a zone label.
  - maxSkew: 1
    topologyKey: topology.kubernetes.io/zone
    whenUnsatisfiable: ScheduleAnyway
    labelSelector:
      matchLabels: { app: edge-ratelimit }
    matchLabelKeys: [pod-template-hash]
# Limits shared across the copies, through the edge-datastores Redis. On a
# Redis error each copy falls back to its own count; traffic is never refused
# for it.
redis:
  addr: edge-datastores-redis.infra.svc.cluster.local:6379
  existingSecret: edge-datastores
  secretKey: REDIS_PASSWORD
