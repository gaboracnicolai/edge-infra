# airgap profile: the ha profile, with every image pulled from your own registry.
# docs/air-gap.md writes your registry in place of the one below before you
# carry the release across.
# The bundled Postgres, Redis and NATS run one copy each. For a highly
# available install, run your own replicated ones and switch these off:
# docs/install.md, "Your own datastores".
global:
  imageRegistry: registry.internal:5000
